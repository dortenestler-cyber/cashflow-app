<style>
/* Layout: iOS-style grouped lists, large titles, five-tab bar; detail views push in, entry opens as a bottom sheet */
:root{
  --bg:#F6F4FB; --card:rgba(255,255,255,.58); --glass-brd:rgba(255,255,255,.75); --glass-sh:0 8px 28px rgba(30,40,90,.08); --blob1:#9fd3ff; --blob2:#ffc3a8; --blob3:#cdb8ff; --fg:#000000; --muted:#8a8a8e; --sep:#e3e3e8; --fill:#e9e9ee;
  --blue:#0a7aff; --alltag:#0a84c6; --goenn:#ff7a1a; --sink:#8a5cf6;
  --ok:#30b45a; --warn:#f2a20c; --bad:#ff3b30; --tip:#fff6dc; --scrim:rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --round:-apple-system,"SF Pro Rounded",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05060a; --card:rgba(40,42,50,.5); --glass-brd:rgba(255,255,255,.12); --glass-sh:0 8px 28px rgba(0,0,0,.4); --blob1:#123a6b; --blob2:#5a2a1c; --blob3:#33205e; --fg:#ffffff; --muted:#98989f; --sep:#38383a; --fill:#2c2c2e;
  --blue:#0a84ff; --alltag:#40a9e6; --goenn:#ff9f45; --sink:#a98bff; --tip:#3a2f12; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05060a; --card:rgba(40,42,50,.5); --glass-brd:rgba(255,255,255,.12); --glass-sh:0 8px 28px rgba(0,0,0,.4); --blob1:#123a6b; --blob2:#5a2a1c; --blob3:#33205e; --fg:#ffffff; --muted:#98989f; --sep:#38383a; --fill:#2c2c2e;
  --blue:#0a84ff; --alltag:#40a9e6; --goenn:#ff9f45; --sink:#a98bff; --tip:#3a2f12; --scrim:rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
.view{max-width:600px;margin:0 auto;padding-block:8px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:12px}
.lt{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.date{color:var(--muted);font-size:14px;margin-top:2px}
.back{background:none;border:0;color:var(--blue);font:inherit;font-size:17px;padding:4px 0;cursor:pointer}
.link{background:none;border:0;color:var(--blue);font:inherit;font-size:15px;cursor:pointer;padding:0}
.sec{display:flex;flex-direction:column;gap:6px}
.sh{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-inline:16px;display:flex;justify-content:space-between;gap:8px}
.group{background:var(--card);border-radius:16px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;box-sizing:border-box;position:relative;width:100%}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:60px;border-top:.5px solid var(--sep)}
.cell.plain+.cell::before,.cell+.cell.plain::before{left:16px}
.cell .t{flex:1;min-width:0}.cell .t>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s{font-size:13px;color:var(--muted)}
.cell .v{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.in{color:var(--ok)}
.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none}
.chev{color:var(--muted);opacity:.6;font-size:20px}
button.cell{border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
button.cell:active{background:var(--fill)}
.tip{background:var(--tip);border-radius:12px;padding:12px 14px;font-size:15px}
.gcard{background:color-mix(in srgb,var(--c) 10%,var(--card));border-radius:22px;padding:14px 16px 12px;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:118px 1fr;gap:4px 14px;align-items:center;width:100%}
.gcard:active{transform:scale(.985)}
.gname{font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.balance{background:linear-gradient(150deg,var(--blue),color-mix(in srgb,var(--blue) 55%,var(--sink)));color:#fff;border-radius:24px;padding:18px 18px 12px;display:flex;flex-direction:column;gap:2px}
.bal{font-family:var(--round);font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.grest{font-family:var(--round);font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gsub{font-size:13px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{background:var(--fill);border-radius:999px;padding:3px 9px;font-size:12px;font-variant-numeric:tabular-nums}
.hero{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.hero svg{max-width:260px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:16px;overflow:hidden}
.kpi{padding:10px 4px;text-align:center;font-size:11px;color:var(--muted);min-width:0}
.kpi+.kpi{border-left:.5px solid var(--sep)}
.kpi b{display:block;color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:3px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:none;color:var(--fg);font:inherit;font-size:13px;font-weight:500;padding:6px 2px;border-radius:7px;cursor:pointer;min-width:0}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:6px}
.monthnav button{border:0;background:none;color:var(--blue);font-size:22px;padding:4px 14px;cursor:pointer}
.monthnav button:disabled{color:var(--muted);opacity:.4}
.monthnav b{font-size:15px}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:8px 10px;color:var(--muted)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:56px;height:56px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;z-index:5}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:.5px solid var(--sep);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:4}
.tabbar button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:10px;font-weight:500;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--blue)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:transparent;border:0;outline:0;width:100%;min-width:0}
.cell input,.cell select{text-align:right}
.cell label{white-space:nowrap}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;width:100%}
.btn.soft{background:var(--fill);color:var(--blue)}
.btn.danger{background:var(--fill);color:var(--bad)}
.hours{color:var(--bad);font-size:13px;font-weight:600}
.choices{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.choices button,.chip{border:0;background:var(--fill);color:var(--blue);border-radius:8px;padding:6px 11px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.shops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shop{background:var(--card);border-radius:12px;padding:16px 4px;text-align:center;color:var(--fg);text-decoration:none;font-size:14px;font-weight:500}
.note{font-size:13px;color:var(--muted);padding-inline:16px}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:15px}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.switch:checked{background:var(--ok)}.switch:checked::after{left:22px}
.emo{width:40px!important;text-align:center!important;font-size:20px;background:var(--fill)!important;border-radius:8px;padding:4px 0!important;flex:none}
.del{border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer;padding:0 4px}
textarea.box{background:var(--card);border-radius:12px;padding:10px 12px;font-size:13px;min-height:120px;box-sizing:border-box}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--bg);border-radius:14px 14px 0 0;z-index:21;max-height:94%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.sheet-h b{font-size:17px}
.sheet-h button{background:none;border:0;color:var(--blue);font:inherit;font-size:17px;cursor:pointer}
.sheet-b{overflow-y:auto;padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
.amount{text-align:center;font-family:var(--round);font-size:46px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amount small{font-size:24px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{border:0;background:var(--card);color:var(--fg);border-radius:12px;padding:10px 2px 8px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-width:0;overflow:hidden}
.cat .ico{width:36px;height:36px;border-radius:50%}
.cat.on{box-shadow:inset 0 0 0 2px var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{border:0;background:var(--card);color:var(--fg);border-radius:10px;padding:13px 0;font:inherit;font-size:22px;font-weight:500;cursor:pointer}
.pad button:active{background:var(--fill)}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover}
.lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.dots{display:flex;gap:16px}.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg)}.dots i.f{background:var(--fg)}
.lock .pad{width:min(300px,100%)}.lock .pad button{border-radius:50%;aspect-ratio:1;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding-inline:4px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}
.chartbox{background:var(--card);border-radius:22px;padding:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}.view{animation:fade .2s ease}}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
@keyframes fade{from{opacity:.4}}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:24px}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;border-radius:24px;color:#fff;padding:18px 18px 14px;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;position:relative;min-height:196px;border:0;font:inherit;text-align:left;cursor:pointer;text-shadow:0 1px 8px rgba(0,0,0,.18)}
.slide .lbl{font-size:15px;font-weight:600;opacity:.92;display:flex;align-items:center;gap:6px}
.slide .sbar{height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:10px}.slide .sbar i{display:block;height:100%;background:#fff;border-radius:3px}
.paint{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:16px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cdots{display:flex;justify-content:center;gap:7px;margin-top:-10px}.cdots i{width:7px;height:7px;border-radius:50%;background:var(--sep);transition:all .2s}.cdots i.on{background:var(--fg);width:18px;border-radius:4px}
.onbg{--fg:#fff;--fill:rgba(255,255,255,.28);--muted:rgba(255,255,255,.8);color:#fff;position:relative}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{aspect-ratio:1;border-radius:14px;border:0;cursor:pointer;max-width:100%}.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--blue)}
.bgprev{height:120px;border-radius:20px;color:#fff;display:flex;align-items:flex-end;padding:14px;font-weight:700;font-size:22px;box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){.swl{animation:swl .25s ease}.swr{animation:swr .25s ease}}
@keyframes swl{from{transform:translateX(30px);opacity:.3}}@keyframes swr{from{transform:translateX(-30px);opacity:.3}}

/* Glass layer: colorful backdrop + translucent, blurred surfaces */
.bgfx{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(40% 35% at 15% 10%,var(--blob1),transparent 70%),
  radial-gradient(45% 35% at 90% 30%,var(--blob2),transparent 70%),
  radial-gradient(50% 40% at 30% 85%,var(--blob3),transparent 70%),var(--bg)}
body{background:var(--bg)}
.group,.gcard,.chartbox,.kpis,.hero:not(.onbg),.cat,.pad button,.shop,.monthnav,.seg,.tip,.search,.sheet,.tabbar,.lock{
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:.5px solid var(--glass-brd);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--glass-sh)}
.seg{background:var(--card)}.seg button.on{background:rgba(255,255,255,.85);color:#000;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.search{background:var(--card)}
.tip{background:color-mix(in srgb,var(--tip) 70%,transparent)}
.tabbar{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:30px;padding:4px 6px;background:var(--card)}
.tabbar button{border-radius:24px;padding:7px 0}.tabbar button.on{background:color-mix(in srgb,var(--blue) 14%,transparent)}
.fab{bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:color-mix(in srgb,var(--blue) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 26px rgba(10,122,255,.35)}
.sheet{background:var(--card);border-radius:28px 28px 0 0}
.slide,.hero.onbg{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 14px 34px rgba(0,0,0,.18);border:.5px solid rgba(255,255,255,.3)}
.paint{border:.5px solid rgba(255,255,255,.45)}
.view{padding-bottom:130px}
.lock{background:var(--card)}
.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cat .ico .i{width:20px;height:20px}
.del{display:grid;place-items:center}.paint{display:grid;place-items:center}
.search .i{color:var(--muted)}
.iconpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%}
.iconpick button{aspect-ratio:1;border:0;border-radius:10px;background:var(--fill);display:grid;place-items:center;cursor:pointer;max-width:100%}
.iconpick button.on{box-shadow:inset 0 0 0 2px currentColor}
.pad button{display:grid;place-items:center}
.sheet-b>*,.view>*{flex-shrink:0}.chip{flex:none}
.seg{overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{min-width:max-content;padding-inline:10px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;width:max-content;max-width:100%}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 75%,var(--fg))}
.badge.bad{background:var(--bad);color:#fff}
.badge.onb.warn{background:#ffd36a;color:#5a3c00}.badge.onb.bad{background:#fff;color:#d70015}
.gcard.st-bad{box-shadow:inset 0 0 0 1.5px var(--bad),var(--glass-sh)}.gcard.st-bad .grest{color:var(--bad)}
.gcard.st-warn .grest{color:color-mix(in srgb,var(--warn) 70%,var(--fg))}
.sl-bad{box-shadow:inset 0 0 0 3px #ff3b30,0 14px 34px rgba(255,59,48,.35)!important}
.tip.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card));box-shadow:inset 0 0 0 1px var(--bad)}
svg text{fill:var(--fg)}

/* ===== Money-Manager look: flat white surfaces, coral accent, blue income, red expenses ===== */
body.mm{--accent:#6E4BD8;--in:#1F9D6B;--out:#E0445E;--bg:#F6F4FB;--card:#ffffff;--blue:#6E4BD8;--sep:#ECE8F4;--fill:#ECE7F7;--muted:#7A7390;--ok:#1F9D6B;--warn:#F2A23A;--bad:#E0445E;--alltag:#4F6BED;--goenn:#F0657A;--sink:#22A699;--tip:#FFF4E2;--fg:#1C1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.mm{--accent:#A48BFF;--in:#3CCB92;--out:#FF6B81;--bg:#0E0B16;--card:#1B1726;--blue:#A48BFF;--sep:#2A2340;--fill:#2A2340;--muted:#A79FBF;--ok:#3CCB92;--warn:#F5B355;--bad:#FF6B81;--alltag:#7088FF;--goenn:#FF7D90;--sink:#35C2B3;--tip:#3A2A12;--fg:#F3F0FA}}
:root[data-theme="dark"] body.mm{--accent:#A48BFF;--in:#3CCB92;--out:#FF6B81;--bg:#0E0B16;--card:#1B1726;--blue:#A48BFF;--sep:#2A2340;--fill:#2A2340;--muted:#A79FBF;--ok:#3CCB92;--warn:#F5B355;--bad:#FF6B81;--alltag:#7088FF;--goenn:#FF7D90;--sink:#35C2B3;--tip:#3A2A12;--fg:#F3F0FA}
body.mm .bgfx{display:none}
body.mm .group,body.mm .gcard,body.mm .chartbox,body.mm .kpis,body.mm .hero:not(.onbg),body.mm .cat,body.mm .pad button,body.mm .shop,body.mm .monthnav,body.mm .seg,body.mm .tip,body.mm .search,body.mm .sheet,body.mm .lock{-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
body.mm .tabbar{-webkit-backdrop-filter:none;backdrop-filter:none;left:0;right:0;bottom:0;border-radius:0;padding:0 0 env(safe-area-inset-bottom,0px);box-shadow:none;border:0;border-top:.5px solid var(--sep);background:var(--card)}
body.mm .tabbar button{border-radius:0}body.mm .tabbar button.on{background:none;color:var(--accent)}
body.mm .fab{bottom:calc(env(safe-area-inset-bottom,0px) + 66px);background:var(--accent);-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
body.mm .view{padding-bottom:110px}
body.mm .group,body.mm .chartbox,body.mm .kpis,body.mm .gcard,body.mm .hero:not(.onbg){border-radius:12px}

function viewSet(k){const back=`<div><button class="back" id="setBack">‹ Mehr</button>`;

const PUSH_FN=`// Supabase Edge Function "push": Mitteilungen für CashFlow (Web Push)
import webpush from "npm:web-push@3.6.7";

const sb = createClient(Deno.env.get("SUPABASE_URL"), Deno.env.get("SUPABASE_SERVICE_ROLE_KEY"));

const J = (o, st = 200) => new Response(JSON.stringify(o), { status: st, headers: { ...cors, "Content-Type": "application/json" } });
async function cfg() {
  let { data } = await sb.from("push_cfg").select("*").eq("id", 1).single();
  if (!data.vapid_public) { const k = webpush.generateVAPIDKeys(); await sb.from("push_cfg").update({ vapid_public: k.publicKey, vapid_private: k.privateKey }).eq("id", 1); data = { ...data, vapid_public: k.publicKey, vapid_private: k.privateKey }; }
  webpush.setVapidDetails("https://dortenestler-cyber.github.io/cashflow-app/", data.vapid_public, data.vapid_private); return data;
}
async function sendTo(uid, msg) {
  const { data: subs } = await sb.from("push_subs").select("*").eq("user_id", uid); let n = 0;
  for (const s of subs || []) {
    try { await webpush.sendNotification(s.sub, JSON.stringify(msg), { TTL: 86400 }); n++; }
    catch (e) { if (e.statusCode === 404 || e.statusCode === 410) await sb.from("push_subs").delete().eq("endpoint", s.endpoint); }
  }
  return n;
}
Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", { headers: cors });
  try {
    const c = await cfg(); const body = await req.json().catch(() => ({}));
    if (req.headers.get("x-cron") && req.headers.get("x-cron") === c.secret) {
      const { data: q } = await sb.from("push_queue").select("*").eq("sent", false).lte("at", new Date().toISOString()).order("at").limit(200);
      for (const m of q || []) {
        if (Date.now() - new Date(m.at).getTime() < 6 * 3600e3) await sendTo(m.user_id, { title: m.title, body: m.body, tag: m.tag });
        await sb.from("push_queue").update({ sent: true }).eq("id", m.id);
      }
      await sb.from("push_queue").delete().eq("sent", true).lt("at", new Date(Date.now() - 7 * 864e5).toISOString());
      return J({ ok: true, n: (q || []).length });
    }
    const jwt = (req.headers.get("authorization") || "").replace(/^Bearer\\s+/i, "");
    const { data: u } = await sb.auth.getUser(jwt); const uid = u && u.user && u.user.id;
    if (!uid) return J({ error: "not signed in" }, 401);
    if (body.op === "key") return J({ key: c.vapid_public, v: 1 });
    if (body.op === "sub") { await sb.from("push_subs").upsert({ endpoint: body.sub.endpoint, user_id: uid, sub: body.sub }); return J({ ok: true }); }
    if (body.op === "unsub") { await sb.from("push_subs").delete().eq("endpoint", body.endpoint).eq("user_id", uid); return J({ ok: true }); }
    if (body.op === "plan") {
      await sb.from("push_queue").delete().eq("user_id", uid).eq("sent", false);
      const items = (body.items || []).slice(0, 30).map((x) => ({ user_id: uid, at: new Date(x.at).toISOString(), title: String(x.title).slice(0, 120), body: String(x.body || "").slice(0, 300), tag: x.tag || null }));
      if (items.length) await sb.from("push_queue").insert(items);
      return J({ ok: true, n: items.length });
    }
    if (body.op === "test") return J({ ok: true, sent: await sendTo(uid, { title: "CashFlow", body: "Mitteilungen funktionieren. 👍", tag: "test" }) });
    return J({ error: "unknown op" }, 400);
  } catch (e) { return J({ error: String(e) }, 500); }
});`;

async function estimateBuy(h){const k=hk2(h,'d');if(!HC[k]){if(h.type=='krypto'){const pts=await cryptoHist(h.sym,'d');if(pts){HC[k]={t:Date.now(),pts};hcSave()}}else await loadHist(true,'d')}

  const P=x.pts.filter(p=>p[1]&&p[0]>=yStart()),mn=Math.min(...P.map(p=>p[1])),mx=Math.max(...P.map(p=>p[1]));

  let best=P[0],bd=1e18;P.forEach(p=>{const d=Math.abs(p[1]-av);if(d<bd){bd=d;best=p}});const hits=P.filter(p=>Math.abs(p[1]-av)/av<0.02).length;
  return{date:ymd(best[0]),msg:`Am ${new Date(best[0]).toLocaleDateString('de-DE')} lag der Kurs bei ${eur(best[1])}, am nächsten an deinem Ø Kaufpreis.${hits>3?' Der Kurs war an mehreren Tagen ähnlich, das Datum ist also nur eine Schätzung.':''}`}}

const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function rawBal(n,t){const a=acc(n);let b=a.start||0;S.exp.forEach(e=>{if(e.t>t||isPlan(e))return;if((e.type=='in'&&e.b==n)||(e.type=='tr'&&e.to==n))b+=e.a;else if((e.type=='out'||e.type=='tr')&&e.b==n)b-=e.a});return b}
const ZM={};
function zinsAt(n,t){const a=acc(n),R=(a.rates||[]).filter(r=>r.p>0).sort((x,y)=>x.from<y.from?-1:1);if(!R.length)return 0;
  const k=n+'|'+dayStart(t)+'|'+S.exp.length+'|'+JSON.stringify(R)+'|'+(a.start||0)+'|'+(a.baseD||0);if(ZM[k]!=null)return ZM[k];
  const r0=new Date(R[0].from+'T00:00').getTime(),from=Math.max(r0,a.baseD||0),end=dayStart(t);if(from>=end)return ZM[k]=0;
  const ev=S.exp.filter(e=>!isPlan(e)&&e.t<end&&(e.b==n||e.to==n)).map(e=>[e.t,((e.type=='in'&&e.b==n)||(e.type=='tr'&&e.to==n))?e.a:-e.a]).sort((x,y)=>x[0]-y[0]);
  let p=a.start||0,i=0,z=0;for(;i<ev.length&&ev[i][0]<from;i++)p+=ev[i][1];
  for(let d=from;d<end;d+=864e5){const de=d+864e5;while(i<ev.length&&ev[i][0]<de){p+=ev[i][1];i++}const ds=ymd(d+12*36e5);let rate=0;for(const r of R)if(r.from<=ds)rate=r.p;z+=(p+z)*rate/36500}
  return ZM[k]=Math.round(z*100)/100}
const rateNow=n=>{const R=(acc(n).rates||[]).filter(r=>r.from<=today()).sort((x,y)=>x.from<y.from?-1:1);return R.length?R[R.length-1].p:0};
