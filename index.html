<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 -apple-system,system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* v181: fester Kopf schrumpft beim Scrollen auf allen Seiten */
.stickhead .hcard{transition:padding .2s,border-radius .2s}.stickhead .hc-month b{transition:font-size .2s}
.stickhead.cmp{gap:6px}
.stickhead.cmp .hcard b{color:inherit;font-weight:800}
.stickhead.cmp .hcard{flex-direction:row;align-items:center;gap:8px;padding:7px 10px;border-radius:18px}
.stickhead.cmp .hcard>*:not(.hc-row):not(.hc-month):not(.hc-big){display:none!important}
.stickhead.cmp .hc-row{order:1;flex:1;min-width:0;min-height:30px}
.stickhead.cmp .hcm .hc-t{display:none}
.stickhead.cmp .hcm .hc-row{flex:none;order:2}
.stickhead.cmp .hcm .hc-row:not(:has(button)){display:none}
.stickhead.cmp .hcm .hc-month{order:1;flex:1;min-width:0}
.stickhead.cmp .hc-month b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stickhead.cmp .hc-bigt{order:3;flex:none;max-width:50%}.stickhead.cmp .hc-bigt .hc-sp,.stickhead.cmp .hc-bigt.dup{display:none}.stickhead.cmp .hc-bigt b{font-size:15px;font-weight:700}
.stickhead.cmp .hc-ic,.stickhead.cmp .hcard .ab-ic{width:30px;height:30px}
.stickhead.cmp .hc-big{order:3;flex:none;flex-direction:row}
.stickhead.cmp .hc-big span{display:none}
.stickhead.cmp .hc-big b{font-size:18px}
.lthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:var(--bg);margin:-10px calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));transition:padding .2s,box-shadow .2s}
.lthead .lt{transition:font-size .2s}
.lthead.cmp{display:flex;align-items:center;min-height:36px;padding-top:6px;padding-bottom:6px;box-shadow:0 .5px 0 var(--sep)}
.lthead.cmp .lt{position:absolute;left:96px;right:96px;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
@media (prefers-reduced-motion:reduce){.stickhead .hcard,.stickhead .hc-month b,.lthead,.lthead .lt{transition:none}}
.aq-fu{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.achip.fu{font-size:13px;padding:6px 11px;color:var(--accent);white-space:normal;text-align:left;max-width:100%;line-height:1.3}.achip.fu svg{width:12px;height:12px;opacity:.7}
</style>
<title>CashFlow</title>

<script>if('serviceWorker' in navigator){let rl=false;const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl||!had)return;rl=true;const sr=document.getElementById('sheetRoot');if(sr&&sr.innerHTML){document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')location.reload()});return}location.reload()});
window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{const up=()=>r.update().catch(()=>{});up();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')up()});setInterval(up,30*60*1000)}).catch(()=>{}))}</script>
